name: Android CD - Publish Release

on:
  push:
    tags:
      - 'v*' # El pipeline solo arranca si el tag empieza con 'v' (ej. v1.0.0, v2.1.3)

permissions:
  contents: write # Necesario para crear el Release en GitHub

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Compilar APK
        # Sin signingConfig, release sale sin firmar; el debug es instalable.
        # Si agregas firma con secrets, cambia a: ./gradlew assembleRelease
        shell: bash
        run: ./gradlew assembleDebug

      - name: Comprimir artefactos de publicación
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "cd app/build/outputs/apk/debug; Compress-Archive -Path ./app-debug.apk -DestinationPath ../../../../../GestionCompras-${{ github.ref_name }}.zip"
          else
            zip -j "./GestionCompras-${{ github.ref_name }}.zip" app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: "apk-${{ matrix.os }}"
          path: "./GestionCompras-${{ github.ref_name }}.zip"
          if-no-files-found: error

  publish-and-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar zips de ambos sistemas
        uses: actions/download-artifact@v4
        with:
          pattern: "apk-*"
          path: ./releases

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # github.ref_name tomará automáticamente el nombre del tag (ej. v1.0.0)
          name: "Release ${{ github.ref_name }}"
          files: ./releases/apk-*/*.zip
          generate_release_notes: true
