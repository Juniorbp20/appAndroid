name: Android CD - Publish Release

on:
  push:
    tags:
      - '[vV]*' # Modificado para que acepte tanto "v" minúscula como "V" mayúscula

permissions:
  contents: write

env:
  KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
  KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restaurar keystore desde secret
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "Falta el secret ANDROID_KEYSTORE_B64" && exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > keystore.jks

      - name: Derivar versiones del tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#V}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          echo "APP_VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        shell: bash
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Renombrar APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "GestionCompras-${{ github.ref_name }}.apk"

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: "apk-gestion-compras"
          path: "./GestionCompras-*.apk"
          if-no-files-found: error

  publish-and-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar APK del paso anterior
        uses: actions/download-artifact@v4
        with:
          name: "apk-gestion-compras"

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          # Subimos directamente el APK firmado en lugar de un ZIP
          files: ./*.apk
          generate_release_notes: true
