name: Android CD - Publish Release

on:
  push:
    tags:
      - '[vV]*' # Modificado para que acepte tanto "v" minúscula como "V" mayúscula

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest # Simplificado a Ubuntu (es más rápido y evita duplicar el APK)

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Compilar APK
        shell: bash
        # Mantenemos assembleDebug para asegurar que sea instalable sin configurar firmas complejas aún
        run: ./gradlew assembleDebug

      - name: Preparar y renombrar APK
        shell: bash
        # Renombramos el archivo temporalmente para que luzca exactamente como en su imagen
        run: mv app/build/outputs/apk/debug/app-debug.apk app-release.apk

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: "apk-gestion-compras"
          path: "./app-release.apk"
          if-no-files-found: error

  publish-and-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar APK del paso anterior
        uses: actions/download-artifact@v4
        with:
          name: "apk-gestion-compras"

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          # Ahora subimos directamente el archivo APK en lugar de un ZIP
          files: app-release.apk
          generate_release_notes: true
