name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: ./gradlew assembleDebug

      - name: Ejecutar tests
        shell: bash
        run: ./gradlew testDebugUnitTest

      - name: Publicar reporte de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Resultados de tests"
          path: "app/build/test-results/testDebugUnitTest/*.xml"
          reporter: "java-junit"
          fail-on-error: "false"

      - name: Subir APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "apk-${{ matrix.os }}"
          path: "app/build/outputs/apk/debug/app-debug.apk"
